server:
  port: 8761

eureka: 
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/


management:
  endpoints:
    web:
      exposure:
        include: health, beans, metrics, info, env
  endpoint:
    health:
      show-details: always
