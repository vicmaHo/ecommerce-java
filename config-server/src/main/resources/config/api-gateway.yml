spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-microservice
              uri: lb://customer-microservice
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - PreserveHostHeader
                - RewritePath=/api/v1/customers/v3/api-docs, /v3/api-docs
            - id: product-microservice
              uri: lb://product-microservice
              predicates:
                - Path=/api/v1/products/**
              filters:
                - PreserveHostHeader
                - RewritePath=/api/v1/products/v3/api-docs, /v3/api-docs
            - id: product-category-route
              uri: lb://product-microservice
              predicates:
                - Path=/api/v1/categories/**
            - id: cart-microservice
              uri: lb://cart-microservice
              predicates:
                - Path=/api/v1/*/cart/**
              filters:
                - PreserveHostHeader
            - id: cart-microservice-docs
              uri: lb://cart-microservice
              predicates:
                - Path=/api/v1/cart/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/api/v1/cart/v3/api-docs, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}

logging:
  level:
    root: INFO
    com.vicma.microservices: WARN
  pattern:
    # formato con hilo, nivel, logger (nombre del logger con max 36 caracteres)
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n' 
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/cart-microservice.log
    max-size: 10MB
    max-files: 30

server:
  port: 8222


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
    endpoint:
      health:
        show-details: always

springdoc:
  swagger-ui:
    urls:
      - name: Customer Microservice
        url: /api/v1/customers/v3/api-docs
      - name: Product Microservice
        url: /api/v1/products/v3/api-docs
      - name: Cart Microservice
        url: /api/v1/cart/v3/api-docs